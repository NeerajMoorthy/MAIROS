# Fly.io configuration for the MAIROS API (FastAPI).
#
#   fly launch --no-deploy --copy-config      # once, to create the app
#   fly volumes create mairos_data --size 3   # Chroma index, graphs, uploads
#   fly secrets set GROQ_API_KEY=... DATABASE_URL=... AUTH_JWKS_URL=... \
#                   AUTH_ISSUER=... AUTH_AUDIENCE=...
#   fly deploy
#
# See docs/DEPLOYMENT.md for the full sequence with Supabase and Cloudflare.

app = "mairos-api"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  DATA_DIR = "/data"
  LOG_LEVEL = "INFO"
  ALLOW_OFFLINE_LLM = "true"
  # The browser talks to the Cloudflare frontend, which proxies /api to this
  # app server-side, so no browser origin needs CORS here. Kept explicit.
  CORS_ORIGINS = '["https://mairos.example.com"]'

[[mounts]]
  source = "mairos_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Agent runs execute inside the process; a machine stopped mid-run loses
  # that run. Keep one machine warm.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  # The embedding model and Chroma want real memory.
  memory = "2gb"
  cpus = 2
